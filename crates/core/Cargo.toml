[package]
name = "teitunnel-core"
description = "Teitunnel's product core: domain, engine, runtime, discovery, doctor and store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "teitunnel_core"

[features]
default = []
# Derive `specta::Type` on types that cross the desktop IPC boundary.
specta = ["dep:specta"]

[dependencies]
teitunnel-cf-api.workspace = true
teitunnel-cloudflared.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
sysinfo.workspace = true
keyring.workspace = true
base64.workspace = true
getrandom.workspace = true
idna.workspace = true
sha2.workspace = true
listeners.workspace = true
qrcode.workspace = true
tokio = { workspace = true, features = ["sync", "process", "time", "io-util", "rt", "macros", "net"] }
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
