[package]
name = "teitunnel-core"
description = "Teitunnel's product core: domain, engine, runtime, discovery, doctor and store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "teitunnel_core"

[features]
default = []
# Derive `specta::Type` on types that cross the desktop IPC boundary.
specta = ["dep:specta", "teitunnel-lens/specta"]

[dependencies]
teitunnel-cf-api.workspace = true
teitunnel-cloudflared.workspace = true
teitunnel-control.workspace = true
teitunnel-lens.workspace = true
teitunnel-localdomains.workspace = true
tokio-rustls.workspace = true
if-addrs.workspace = true
time.workspace = true
bytes.workspace = true
http.workspace = true
futures-util.workspace = true
flate2.workspace = true
tar.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
specta = { workspace = true, optional = true }
thiserror.workspace = true
sysinfo.workspace = true
keyring.workspace = true
base64.workspace = true
argon2.workspace = true
zeroize.workspace = true
chacha20poly1305.workspace = true
getrandom.workspace = true
idna.workspace = true
sha2.workspace = true
listeners.workspace = true
ipnet.workspace = true
jiff.workspace = true
intl_pluralrules.workspace = true
unic-langid.workspace = true
qrcode.workspace = true
tokio = { workspace = true, features = ["sync", "process", "time", "io-util", "rt", "macros", "net"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[build-dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
tokio-tungstenite.workspace = true

[lints]
workspace = true
