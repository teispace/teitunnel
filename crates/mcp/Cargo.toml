[package]
name = "teitunnel-mcp"
description = "Teitunnel's MCP server: tools, resources and prompts for AI agents over the core engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "teitunnel_mcp"

[dependencies]
teitunnel-core.workspace = true
teitunnel-cf-api.workspace = true
teitunnel-cloudflared.workspace = true
rmcp = { workspace = true, features = ["server", "schemars", "elicitation", "transport-io", "transport-streamable-http-server"] }
schemars.workspace = true
axum.workspace = true
futures-util.workspace = true
jsonc-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "io-std", "net"] }
tokio-util.workspace = true
toml_edit.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rmcp = { workspace = true, features = ["server", "client", "schemars", "elicitation", "transport-io", "transport-streamable-http-server"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util", "io-util"] }
reqwest.workspace = true

[lints]
workspace = true
