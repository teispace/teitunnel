[package]
name = "teitunnel-lens"
description = "Lens: Teitunnel's local inspecting reverse proxy (capture, replay, export, gates, webhooks)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "lens"

[dependencies]
argon2.workspace = true
base64.workspace = true
brotli-decompressor.workspace = true
bytes.workspace = true
flate2.workspace = true
getrandom.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
httpdate.workspace = true
hyper = { workspace = true, features = ["client", "server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "server", "server-auto", "http1", "http2"] }
ipnet.workspace = true
mime_guess.workspace = true
percent-encoding.workspace = true
regex.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "rt", "macros", "fs"] }
tokio-rustls.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tokio-tungstenite.workspace = true

[[bench]]
name = "overhead"
harness = false

[lints]
workspace = true
