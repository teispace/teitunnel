[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri", "tools/fake-cloudflared", "tools/fake-cloudflare"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/teispace/teitunnel"
homepage = "https://github.com/teispace/teitunnel"
authors = ["Teispace <info@teispace.com>"]
publish = false

[workspace.dependencies]
# Internal
teitunnel-cf-api = { path = "crates/cf-api" }
teitunnel-cloudflared = { path = "crates/cloudflared" }
teitunnel-core = { path = "crates/core" }
teitunnel-control = { path = "crates/control" }
teitunnel-lens = { path = "crates/lens" }
teitunnel-localdomains = { path = "crates/localdomains" }
teitunnel-mcp = { path = "crates/mcp" }

# Tauri (stay on 2.x, D-015)
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-build = { version = "2.5" }
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-window-state = "2.4"
tauri-plugin-opener = "2.5"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.12.0"
tauri-plugin-dialog = "2.7.3"
# `teitunnel://` links (M12-07)
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-global-shortcut = "2.3.2"
# E2E only (never in release builds): embedded WebDriver for @wdio/tauri-service.
tauri-plugin-wdio-webdriver = "1.4.0"
tauri-plugin-wdio = "1.4.0"
# Pinned exactly: release candidates (D-014)
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"

# macOS
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSColor", "NSColorSpace"] }

# Runtime
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
tokio-util = "0.7"
ipnet = "2.12"
# Time zones for scheduled shares (the system's tz database; bundled on Windows)
jiff = "0.2.37"
# Localization (D-062)
intl_pluralrules = "7.0.2"
unic-langid = "0.9.6"
sys-locale = "0.3.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
uuid = { version = "1.26", features = ["v4", "serde"] }
regex = "1.13"
idna = "1"
serde-saphyr = "1.3"
sha2 = "0.11.0"
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "stream"] }

# Processes
nix = { version = "0.31.3", default-features = false, features = ["signal", "process"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
listeners = "0.6.1"

# Secrets (OS keychain)
keyring = "4.2.0"
base64 = "0.23"
getrandom = "0.4.3"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
# Encrypted backups ("move to a new computer"): RustCrypto AEAD (NCC Group audit, 2020).
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }

# Lens: the local inspector proxy (crates/lens)
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
http = "1.5"
http-body = "1.1"
http-body-util = "0.1.5"
bytes = "1.12"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
rustls-platform-verifier = "0.7.0"
ring = "0.17.14"
subtle = "2.6"
brotli-decompressor = "5.0.3"
httpdate = "1.0.3"
percent-encoding = "2.3.2"
mime_guess = { version = "2.0.5", default-features = false }
# Local HTTPS domains (crates/localdomains)
# One TLS crypto provider for the workspace: AWS-LC (reqwest's too); crates pass it explicitly.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
time = "0.3.44"
zeroize = "1.8"
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
mdns-sd = "0.21.4"
plist = "1.10"
x509-parser = "0.18.1"
sha1 = "0.11"
# This computer's addresses (local domains accept them as local; already used by mdns-sd).
if-addrs = "0.15"

# Web dashboard for servers (teitunnel-cli serve)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }

# MCP server (teitunnel mcp, M12-03)
rmcp = { version = "3.4.1", default-features = false }
schemars = "1.2"
jsonc-parser = { version = "0.33.2", features = ["cst", "serde_json"] }
toml_edit = "0.25.15"

# Persistence
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"

# Testing
insta = { version = "1.48", features = ["json", "yaml"] }
proptest = "1.11"
tempfile = "3"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
# Selected pedantic lints
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
