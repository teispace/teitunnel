<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Teitunnel</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header>
        <img src="icons/32.png" alt="" width="20" height="20" />
        <h1>Teitunnel</h1>
      </header>
      <section id="page" aria-live="polite"></section>
      <section>
        <h2>Shares</h2>
        <ul id="shares" aria-live="polite"></ul>
      </section>
      <p id="message" role="status" hidden></p>
      <footer>
        <button id="open" type="button">Open Teitunnel</button>
      </footer>
    </main>
  </body>
</html>
