name: Release

# Runs when a maintainer pushes a `v*` tag. Builds a universal macOS app and attaches it
# to a DRAFT GitHub Release; a maintainer reviews the notes and publishes it by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (universal)
    runs-on: macos-latest
    env:
      # Skips the Finder AppleScript that styles the DMG window (needs a GUI session).
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Build
        run: pnpm --filter @teitunnel/desktop tauri build --target universal-apple-darwin
      - name: Checksums
        run: |
          cd target/universal-apple-darwin/release/bundle/dmg
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Teitunnel ${GITHUB_REF_NAME#v}" \
            --notes-file docs/release-notes/"$GITHUB_REF_NAME".md \
            target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
