name: Docs

# Builds the website (apps/web: landing page and docs, Next.js + Fumadocs, static) on
# every change to it. Deploying to GitHub Pages is
# opt-in: enable Pages (Settings > Pages > Source: GitHub Actions) and set the
# repository variable DEPLOY_DOCS to "true" (D-053).
on:
  pull_request:
    paths: ["apps/web/**", ".github/workflows/docs.yml", "scripts/release/linux-repo.sh", "pnpm-lock.yaml"]
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/docs.yml", "scripts/release/linux-repo.sh", "pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # On main, the release environment holds the Linux repository signing key.
    environment: ${{ github.ref == 'refs/heads/main' && vars.DEPLOY_DOCS == 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Served at the root of teitunnel.teispace.com (public/CNAME sets the custom domain).
      # The download pages link to the latest release; the release workflow runs this by
      # hand after publishing, and then a missing release fails the build.
      - run: pnpm --filter @teitunnel/web build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
      # apt and dnf repositories at /linux/ (D-086) with the two latest releases, each
      # package checked against its release's checksums and build provenance first.
      - name: Linux package repositories
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_DOCS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_REPO_GPG_KEY: ${{ secrets.LINUX_REPO_GPG_KEY }}
        run: |
          if [ -z "$LINUX_REPO_GPG_KEY" ]; then
            echo "::warning::No LINUX_REPO_GPG_KEY: the site has no apt/dnf repositories."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c rpm >/dev/null
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$LINUX_REPO_GPG_KEY" | gpg --batch --quiet --import
          pkgs="$RUNNER_TEMP/packages"
          mkdir -p "$pkgs"
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 2 \
            --json tagName -q '.[].tagName'); do
            dir="$RUNNER_TEMP/release-$tag"
            gh release download "$tag" -D "$dir" -p '*.deb' -p '*.rpm' -p SHA256SUMS.txt
            (cd "$dir" && sha256sum --check --ignore-missing --strict --quiet SHA256SUMS.txt)
            for f in "$dir"/*.deb "$dir"/*.rpm; do
              gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" >/dev/null
              cp "$f" "$pkgs/"
            done
          done
          scripts/release/linux-repo.sh "$pkgs" apps/web/out/linux https://teitunnel.teispace.com/linux
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && vars.DEPLOY_DOCS == 'true'
        with:
          path: apps/web/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_DOCS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
