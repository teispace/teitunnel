name: Integrations

# The editor and launcher extensions in integrations/ (control client, VS Code, Raycast,
# JetBrains): their unit tests, the shared client against the real control server
# (crates/control's `fake_app` example, including the Windows named pipe), type checks and
# builds. Nothing is published from here.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integrations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Only changes that can affect the extensions run them. (A skipped job counts as passed.)
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      client: ${{ steps.filter.outputs.client }}
      raycast: ${{ steps.filter.outputs.raycast }}
      jetbrains: ${{ steps.filter.outputs.jetbrains }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            client:
              - "integrations/control-client/**"
              - "integrations/vscode/**"
              - "crates/control/**"
              - "pnpm-lock.yaml"
              - ".github/workflows/integrations-test.yml"
            raycast:
              - "integrations/control-client/**"
              - "integrations/raycast/**"
              - ".github/workflows/integrations-test.yml"
            jetbrains:
              - "integrations/jetbrains/**"
              - ".github/workflows/integrations-test.yml"
            browser:
              - "integrations/browser/**"
              - ".github/workflows/integrations-test.yml"

  client:
    name: Control client and VS Code (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.client == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build the real control server over a scripted host
        run: cargo build --locked -p teitunnel-control --features testing --example fake_app
      - name: Control client (with the interop tests)
        shell: bash
        run: |
          app="$GITHUB_WORKSPACE/target/debug/examples/fake_app"
          if [ "$RUNNER_OS" = "Windows" ]; then app="$app.exe"; fi
          TEITUNNEL_FAKE_APP="$app" pnpm --filter @teitunnel/control-client test
      - run: pnpm --filter @teitunnel/control-client typecheck
      - run: pnpm --filter ./integrations/vscode typecheck
      - run: pnpm --filter ./integrations/vscode build
      - run: pnpm --filter ./integrations/vscode test

  browser:
    name: Browser extension
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @teitunnel/browser-extension typecheck
      - run: pnpm --filter @teitunnel/browser-extension test
      - run: pnpm --filter @teitunnel/browser-extension build

  raycast:
    name: Raycast
    needs: changes
    if: needs.changes.outputs.raycast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: integrations/raycast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      # Tests include the check that src/control-client matches the shared client.
      - run: npm test
      - run: npx tsc --noEmit -p .

  jetbrains:
    name: JetBrains
    needs: changes
    if: needs.changes.outputs.jetbrains == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: integrations/jetbrains
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew --no-daemon test buildPlugin verifyPluginProjectConfiguration

  ok:
    name: Integrations
    if: always()
    needs: [changes, client, raycast, jetbrains]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$NEEDS" >/dev/null
