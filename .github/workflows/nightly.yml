name: Nightly

# Real-world checks that need the network and the real cloudflared: install the latest
# release (digest, checksum, Cloudflare signature), then serve a local origin through a
# real Quick Share and fetch it from the public URL.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-quick-share:
    name: Real Quick Share (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-nextest
      - run: mkdir -p apps/desktop/dist
      - name: Real install and Quick Share
        run: cargo nextest run --workspace --locked --run-ignored only
      - name: Always-on connector through the real launchd
        env:
          TEITUNNEL_TEST_LAUNCHD: "1"
        run: cargo nextest run -p fake-cloudflared --locked -E 'test(installs_runs_and_removes_an_agent)'
