name: Feature request
description: A focused improvement, ready to work on. For open-ended ideas, start a discussion in Ideas.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Big or open-ended ideas are best discussed first in [Discussions ▸ Ideas](https://github.com/teispace/teitunnel/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like Teitunnel to do
      description: How it would work for you, in the app, the command line or for an AI agent.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What you do today, or other ways this could be solved.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
