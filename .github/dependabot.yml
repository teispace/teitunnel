version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # Release candidates are pinned on purpose (D-014); Tauri stays on 2.x (D-015).
      - dependency-name: "specta*"
      - dependency-name: "tauri-specta"
      - dependency-name: "tauri*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      web:
        patterns: ["*"]
    ignore:
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
