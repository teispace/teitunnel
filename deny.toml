# cargo-deny: supply-chain policy (SECURITY_MODEL).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Transitive unmaintained crates (e.g. via Tauri/GTK) are tracked upstream; flag only our direct deps.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  # Public-domain equivalent; `interprocess` (Windows control pipe) and its helpers.
  "0BSD",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # Keep the Tauri boundary: only the desktop crate may depend on Tauri.
  { crate = "tauri", wrappers = ["teitunnel-desktop", "tauri-plugin-single-instance", "tauri-plugin-window-state", "tauri-plugin-opener", "tauri-plugin-clipboard-manager", "tauri-plugin-notification", "tauri-plugin-autostart", "tauri-plugin-updater", "tauri-plugin-dialog", "tauri-plugin-deep-link", "tauri-plugin-global-shortcut", "tauri-plugin-fs", "tauri-plugin-wdio-webdriver", "tauri-plugin-wdio", "tauri-specta", "tauri-specta-macros"] },
  { crate = "openssl-sys", wrappers = [] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
