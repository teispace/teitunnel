[package]
name = "teitunnel-desktop"
description = "Teitunnel desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "teitunnel"

[lib]
name = "teitunnel_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "teitunnel"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
teitunnel-core = { workspace = true, features = ["specta"] }
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-opener.workspace = true
tauri-plugin-window-state.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance.workspace = true

[lints]
workspace = true
