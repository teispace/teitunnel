[package]
name = "teitunnel-desktop"
description = "Teitunnel desktop app (Tauri shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "teitunnel"

[lib]
name = "teitunnel_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "teitunnel"
path = "src/main.rs"

# Dev tool (`pnpm bindings`); gated so release bundles never include it.
[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
required-features = ["bindings"]

[features]
default = []
# Embedded WebDriver server for E2E tests. Never enable for release builds.
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]
# Builds the `export-bindings` tool.
bindings = []

[build-dependencies]
tauri-build.workspace = true

[dependencies]
teitunnel-core = { workspace = true, features = ["specta"] }
teitunnel-mcp.workspace = true
teitunnel-control.workspace = true
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-opener.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-autostart.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-deep-link.workspace = true
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
tauri-plugin-wdio = { workspace = true, optional = true }
tauri-plugin-window-state.workspace = true
tauri-specta.workspace = true
specta.workspace = true
specta-typescript.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { workspace = true, features = ["deep-link"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
