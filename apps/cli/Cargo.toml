[package]
name = "teitunnel-cli"
description = "Teitunnel's command-line interface: routes and exports from the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Not `teitunnel`: on case-insensitive disks that would be the same file as the app's
# `Teitunnel` binary in the shared target directory.
[[bin]]
name = "teitunnel-cli"
path = "src/main.rs"

[dependencies]
teitunnel-cf-api.workspace = true
teitunnel-core.workspace = true
teitunnel-cloudflared.workspace = true
teitunnel-mcp.workspace = true
teitunnel-control.workspace = true
tokio-util.workspace = true
base64.workspace = true
# `teitunnel top` (M12-07)
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dirs = "7"
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
tokio.workspace = true
axum.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
teitunnel-control = { workspace = true, features = ["testing"] }

[lints]
workspace = true
