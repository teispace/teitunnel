packages:
  - apps/*
  # The editor extensions' shared client and the VS Code extension. The Raycast
  # extension stays outside: the Raycast Store builds it with npm and its own lockfile.
  - integrations/control-client
  - integrations/vscode
  - integrations/browser

# Only these dependencies may run install scripts (supply-chain policy).
allowBuilds:
  lefthook: true
  # WebdriverIO pulls these in; we drive the Tauri app directly and don't need
  # browser drivers, and esbuild works without its optional postinstall check.
  edgedriver: false
  geckodriver: false
  esbuild: false

minimumReleaseAgeExclude:
  - fumadocs-core@16.15.13
  - fumadocs-ui@16.15.13

# Patched versions of transitive dependencies (security advisories).
overrides:
  vite@>=8.3.0 <8.3.3: 8.3.6
  zod@>=4.0.0 <4.6.6: 4.6.7
  minimatch@>=7.0.0 <11.0.1: 11.0.5
  glob@>=9.0.0 <14.0.2: 14.0.4
