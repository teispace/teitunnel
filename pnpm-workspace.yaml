packages:
  - apps/*

# Only these dependencies may run install scripts (supply-chain policy).
allowBuilds:
  lefthook: true
  # WebdriverIO pulls these in; we drive the Tauri app directly and don't need
  # browser drivers, and esbuild works without its optional postinstall check.
  edgedriver: false
  geckodriver: false
  esbuild: false

minimumReleaseAgeExclude:
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - fumadocs-core@16.15.13
  - fumadocs-ui@16.15.13
  - next@16.3.6
